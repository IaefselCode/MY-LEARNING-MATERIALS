<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"
      integrity="sha512-8ExARjWWkIllMlNzVg7JKq9RKWPlJABQUNq6YvAjE/HobctjH/NA+bSiDMDvouBVjp4Wwnf1VP1OEv7Zgjtuxw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1 class="brand-title">ChatApp</h1>
        </div>
        <form class="form-join" autocomplete="off">
          <label class="sr-only" for="name">Your name</label>
          <input
            type="text"
            id="name"
            maxlength="8"
            placeholder="Your name"
            required
          />
          <label class="sr-only" for="room">Room</label>
          <input
            type="text"
            id="room"
            placeholder="room"
            required
          />
          <button id="join" type="submit">Join</button>
        </form>
      </header>

      <section class="chat-panel" aria-label="Messages">
        <ul class="chat-display"></ul>
        <div class="chat-meta">
          <p class="user-list"></p>
          <p class="room-list"></p>
        </div>
        <p class="activity" role="status" aria-live="polite"></p>
      </section>

      <form class="form-message" autocomplete="off">
        <label class="sr-only" for="message">Message</label>
        <input type="text" id="message" placeholder="Type a message…" required />
        <button type="submit">Send</button>
      </form>
    </main>
  </body>
</html>
