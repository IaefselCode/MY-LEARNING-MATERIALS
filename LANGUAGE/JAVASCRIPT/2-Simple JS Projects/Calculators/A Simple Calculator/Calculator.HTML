<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="Calculator.css">
</head>

<body>
    <center>
        <h1>IAEFSEL Simple Calculator</h1>
    </center>
    <div class="calculator">
        <div class="text">
            <input type="text" class="display" id="display" placeholder="0" readonly>
        </div>
        <div class="buttons">
            <div class="rows">
                <input type="button" value="AC" onclick="clr()">
                <input type="button" value="DE" onclick="del()">
                <input type="button" value="." onclick="calculate('.')">
                <input type="button" value="/" onclick="calculate('/')">
            </div>
            <div class="rows">
                <input type="button" value="7" onclick="calculate(7)">
                <input type="button" value="8" onclick="calculate(8)">
                <input type="button" value="9" onclick="calculate(9)">
                <input type="button" value="*" onclick="calculate('*')">
            </div>
            <div class="rows">
                <input type="button" value="4" onclick="calculate(4)">
                <input type="button" value="5" onclick="calculate(5)">
                <input type="button" value="6" onclick="calculate(6)">
                <input type="button" value="-" onclick="calculate('-')">
            </div>
            <!--There is the calculate function with the argument of the number -->
            <div class="rows">
                <input type="button" value="1" onclick="calculate(1)">
                <input type="button" value="2" onclick="calculate(2)">
                <input type="button" value="3" onclick="calculate(3)">
                <input type="button" value="+" onclick="calculate('+')">
            </div>
            <div class="rows">
                <input type="button" value="00" onclick="calculate('00')">
                <input type="button" value="0" onclick="calculate(0)">
                <input type="button" class="ansbtn" value="=" onclick="answer()">
            </div>
        </div>
    </div>
    <script src="Calculator.js"></script>
</body>

</html>
