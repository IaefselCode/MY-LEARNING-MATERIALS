<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simpe Arithmetic Calculator</title>
    <link rel="stylesheet" href="Arithmetic Calculator.css">
</head>

<body>
    <div class="calc">
        <h1>SIMPLE ARITHMETIC CALCULATOR</h1>
        <hr>
            <input type="number" id="first">
            <input type="number" id="second">
            <div class="btn">
                <button id="add">+</button>
                <button id="sub">-</button>
                <button id="multi">*</button>
                <button id="div">/</button>
            </div>
            <input type="number" id="result" class="result" placeholder="0" readonly>
    </div>
    <script src="Arithmetic Calculator.js"></script>
</body>

</html>
